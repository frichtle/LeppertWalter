name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache impression photos
        uses: actions/cache@v4
        with:
          path: public/impressionen
          key: fullsize-photos-v1

      - name: Download all 527 full-resolution impression photos
        run: node scripts/download_fullsize_images.cjs

      - name: Commit all original photos permanently to git repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          sed -i '/public\/impressionen\//d' .gitignore
          git add -f public/impressionen/ public/images/ .gitignore
          if git diff --staged --quiet; then
            echo "All photos are already committed in the repository."
          else
            git commit -m "feat: store all 527 original photos in public/impressionen"
            git push origin HEAD:${{ github.ref_name }} || echo "Push skipped or requires write permission in Repo Settings -> Actions -> General"
          fi

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to gh-pages branch (fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
        continue-on-error: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
